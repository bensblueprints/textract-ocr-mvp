<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Textract — region capture</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: rgba(0,0,0,0.25); }
  #hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(15,17,22,0.85); color: #e9edf3; font: 13px 'Segoe UI', Arial, sans-serif;
    padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
  }
  #rect {
    position: fixed; border: 2px solid #7dd3fc; background: rgba(125,211,252,0.12);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    display: none;
  }
  #dims {
    position: absolute; bottom: -22px; left: 0; font: 11px 'Segoe UI', Arial, sans-serif;
    color: #7dd3fc; background: rgba(15,17,22,0.85); padding: 2px 6px; border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="hint">Drag to select a region &middot; Esc to cancel</div>
  <div id="rect"><span id="dims"></span></div>
  <script src="overlay.js"></script>
</body>
</html>
